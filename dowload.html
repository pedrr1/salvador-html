<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar Aplicativo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        .btn-download {
            background-color: #2ea44f;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <h1>Baixar o Programa de Automação</h1>
    <p>Clique no botão abaixo para baixar o seu executável:</p>
    <br>
    
    <!-- O atributo 'download' força o navegador a baixar o arquivo em vez de tentar abri-lo -->
    <a href="dist/test.exe" class="btn-download" download>Baixar test.exe</a>

</body>
</html>
