<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Player Estilo Spotify</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background-color: #181818;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 22px;
        }
        .artist {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover {
            background-color: #1ed760;
            transform: scale(1.05);
        }
        button.secondary {
            background-color: #282828;
            color: #fff;
            width: 35px;
            height: 35px;
            font-size: 14px;
        }
        button.secondary:hover {
            background-color: #3e3e3e;
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: #b3b3b3;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #1db954;
            cursor: pointer;
        }
        .playlist-info {
            font-size: 12px;
            color: #b3b3b3;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2 id="track-title">Música 1</h2>
        <div class="artist" id="artist-name">Artista da Música 1</div>

        <!-- Elementos de áudio para as 5 músicas (basta trocar o src para o arquivo real) -->
        <audio id="audio0" src="musica1.mp3"></audio>
        <audio id="audio1" src="musica2.mp3"></audio>
        <audio id="audio2" src="musica3.mp3"></audio>
        <audio id="audio3" src="musica4.mp3"></audio>
        <audio id="audio4" src="musica5.mp3"></audio>

        <div class="controls">
            <button class="secondary" onclick="mudarMusica(-1)" title="Anterior">⏮</button>
            <button id="play-pause-btn" onclick="togglePlayPause()">▶</button>
            <button class="secondary" onclick="mudarMusica(1)" title="Próxima">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" oninput="mudarVolume(this.value)">
        </div>

        <div class="playlist-info" id="playlist-status">Faixa 1 de 5</div>
    </div>

    <script>
        // Array com todos os elementos de áudio (do 0 ao 4, totalizando 5)
        const audios = [
            document.getElementById('audio0'),
            document.getElementById('audio1'),
            document.getElementById('audio2'),
            document.getElementById('audio3'),
            document.getElementById('audio4')
        ];
        
        // Informações das 5 músicas para exibição na tela
        const playlist = [
            { titulo: "Música 1", artista: "Artista da Música 1" },
            { titulo: "Música 2", artista: "Artista da Música 2" },
            { titulo: "Música 3", artista: "Artista da Música 3" },
            { titulo: "Música 4", artista: "Artista da Música 4" },
            { titulo: "Música 5", artista: "Artista da Música 5" }
        ];

        let indiceAtual = 0;

        const playPauseBtn = document.getElementById('play-pause-btn');
        const trackTitle = document.getElementById('track-title');
        const artistName = document.getElementById('artist-name');
        const playlistStatus = document.getElementById('playlist-status');
        const volumeSlider = document.getElementById('volume-slider');

        function atualizarInterface() {
            trackTitle.innerText = playlist[indiceAtual].titulo;
            artistName.innerText = playlist[indiceAtual].artista;
            playlistStatus.innerText = `Faixa ${indiceAtual + 1} de ${audios.length}`;
            playPauseBtn.innerText = audios[indiceAtual].paused ? "▶" : "⏸";
        }

        function togglePlayPause() {
            const audioAtual = audios[indiceAtual];
            if (audioAtual.paused) {
                // Pausa todas as outras músicas caso alguma estivesse tocando
                audios.forEach((a, idx) => {
                    if (idx !== indiceAtual) {
                        a.pause();
                        a.currentTime = 0;
                    }
                });
                audioAtual.play();
            } else {
                audioAtual.pause();
            }
            atualizarInterface();
        }

        function mudarMusica(direcao) {
            // Pausa a música atual e reinicia o tempo dela
            audios[indiceAtual].pause();
            audios[indiceAtual].currentTime = 0;

            // Altera o índice (avança ou volta)
            indiceAtual += direcao;
            
            // Faz o loop infinito (se passar da última, volta pra 1; se voltar antes da primeira, vai pra última)
            if (indiceAtual >= audios.length) indiceAtual = 0;
            if (indiceAtual < 0) indiceAtual = audios.length - 1;

            // Toca a nova música selecionada
            audios[indiceAtual].play();
            atualizarInterface();
        }

        function mudarVolume(valor) {
            audios.forEach(audio => {
                audio.volume = valor;
            });
        }

        // Sincroniza os eventos de play/pause e quando a música termina sozinha
        audios.forEach((audio, idx) => {
            audio.addEventListener('play', () => {
                if (idx === indiceAtual) atualizarInterface();
            });
            audio.addEventListener('pause', () => {
                if (idx === indiceAtual) atualizarInterface();
            });
            audio.addEventListener('ended', () => {
                mudarMusica(1); // Passa para a próxima automaticamente ao acabar
            });
        });

        // Atalhos de Teclado (Espaço para Play/Pause e M para Mudo)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            }
            
            if (e.key.toLowerCase() === 'm') {
                audios.forEach(audio => {
                    audio.muted = !audio.muted;
                });
                volumeSlider.value = audios[indiceAtual].muted ? 0 : audios[indiceAtual].volume;
            }
        });
    </script>
</body>
</html>
