<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Player Estilo Spotify</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background-color: #181818;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 22px;
        }
        .artist {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            background-color: #1db954;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover {
            background-color: #1ed760;
            transform: scale(1.05);
        }
        button.secondary {
            background-color: #282828;
            color: #fff;
            width: 35px;
            height: 35px;
            font-size: 14px;
        }
        button.secondary:hover {
            background-color: #3e3e3e;
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: #b3b3b3;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #1db954;
            cursor: pointer;
        }
        .playlist-info {
            font-size: 12px;
            color: #b3b3b3;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2 id="track-title">Música 1</h2>
        <div class="artist">Artista Local</div>

        <!-- Insira os nomes dos seus 3 arquivos de música abaixo nos atributos src -->
        <audio id="audio1" src="musica1.mp3"></audio>
        <audio id="audio2" src="musica2.mp3"></audio>
        <audio id="audio3" src="musica3.mp3"></audio>

        <div class="controls">
            <button class="secondary" onclick="mudarMusica(-1)" title="Anterior">⏮</button>
            <button id="play-pause-btn" onclick="togglePlayPause()">▶</button>
            <button class="secondary" onclick="mudarMusica(1)" title="Próxima">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" oninput="mudarVolume(this.value)">
        </div>

        <div class="playlist-info" id="playlist-status">Faixa 1 de 3</div>
    </div>

    <script>
        const audios = [
            document.getElementById('audio1'),
            document.getElementById('audio2'),
            document.getElementById('audio3')
        ];
        
        const titulos = ["Música 1", "Música 2", "Música 3"];
        let indiceAtual = 0;

        const playPauseBtn = document.getElementById('play-pause-btn');
        const trackTitle = document.getElementById('track-title');
        const playlistStatus = document.getElementById('playlist-status');
        const volumeSlider = document.getElementById('volume-slider');

        function atualizarInterface() {
            trackTitle.innerText = titulos[indiceAtual];
            playlistStatus.innerText = `Faixa ${indiceAtual + 1} de ${audios.length}`;
            playPauseBtn.innerText = audios[indiceAtual].paused ? "▶" : "⏸";
        }

        function togglePlayPause() {
            const audioAtual = audios[indiceAtual];
            if (audioAtual.paused) {
                // Pausa todas as outras caso estejam tocando
                audios.forEach((a, idx) => {
                    if (idx !== indiceAtual) {
                        a.pause();
                        a.currentTime = 0;
                    }
                });
                audioAtual.play();
            } else {
                audioAtual.pause();
            }
            atualizarInterface();
        }

        function mudarMusica(direcao) {
            audios[indiceAtual].pause();
            audios[indiceAtual].currentTime = 0;

            indiceAtual += direcao;
            if (indiceAtual >= audios.length) indiceAtual = 0;
            if (indiceAtual < 0) indiceAtual = audios.length - 1;

            audios[indiceAtual].play();
            atualizarInterface();
        }

        function mudarVolume(valor) {
            audios.forEach(audio => {
                audio.volume = valor;
            });
        }

        // Detectar teclas de Atalho (Espaço para Pause/Play e M para Mudo)
        window.addEventListener('keydown', (e) => {
            // Evita conflito com o espaço rolando a página para baixo
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            }
            
            // Tecla M para Mutar / Desmutar
            if (e.key.toLowerCase() === 'm') {
                audios.forEach(audio => {
                    audio.muted = !audio.muted;
                });
                volumeSlider.value = audios[indiceAtual].muted ? 0 : audios[indiceAtual].volume;
            }
        });

        // Quando a música acaba sozinha, pula para a próxima
        audios.forEach((audio, idx) => {
            audio.addEventListener('ended', () => {
                mudarMusica(1);
            });
        });
    </script>
</body>
</html>
